name: modern-ui
label: "LOOPS CA Modern"
description: "High-contrast Slate & Indigo theme for LOOPS CA Dashboard."

# 1. Palette: Slate 900 & Indigo 6366f1
palette:
  background: 
    hex: "#0f172a"
  foreground: 
    hex: "#f8fafc"
  primary: 
    hex: "#6366f1"
  secondary: 
    hex: "#4f46e5"
  accent: 
    hex: "#818cf8"
  muted: 
    hex: "#1e293b"
  border: 
    hex: "#334155"

# 2. Typography
typography:
  fontSans: "'Inter', -apple-system, system-ui, sans-serif"
  fontMono: "'Fira Code', 'JetBrains Mono', monospace"
  baseSize: "14px"

# 3. Layout
layout:
  radius: "12px"
  borderWidth: "1px"
  gap: "1rem"

# 4. Layout Variant
# Cockpit is more suitable for executive "command center" feel
layoutVariant: cockpit

# 5. Custom CSS: Specific overrides for cards and sidebar
customCSS: |
  .card, .panel, .dashboard-item {
      background-color: #1e293b !important;
      border: 1px solid #334155 !important;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1) !important;
  }
  
  button {
      border-radius: 8px !important;
      transition: all 0.2s ease !important;
  }
  
  button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1) !important;
  }
  
  .sidebar {
      background-color: #020617 !important;
      border-right: 1px solid #1e293b !important;
  }

  /* Header Branding */
  header::after {
      content: "LOOPS CA v2.0";
      position: absolute;
      right: 120px;
      font-weight: bold;
      color: #6366f1;
      font-family: 'Inter', sans-serif;
  }
