services:
  # 1. Hermes Assistant Core
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes_core
    command: gateway run
    restart: unless-stopped
    # No internal 'Caddy' needed - Dokploy handles SSL and domains
    ports:
      - "9119:9119" # Main UI
      - "8642:8642" # API
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_INSECURE=true
      - HERMES_DASHBOARD_TUI=1
      - HERMES_SYSTEM_INSTRUCTIONS_PATH=/opt/data/SOUL.md
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - hermes_data:/opt/data
      - ./modern-ui.css:/opt/hermes/custom-style.css:ro
      - ./rebrand.sh:/etc/cont-init.d/00-rebrand:ro
      - ./SOUL.md:/opt/data/SOUL.md:ro

  # 2. WhatsApp Gateway (WAHA)
  waha:
    image: devlikeapro/waha:latest
    container_name: loops_whatsapp_gw
    restart: unless-stopped
    ports:
      - "3007:3000" # WAHA Dashboard
    environment:
      - WHATSAPP_HOOK_URL=http://waha-bridge:8000/webhook/whatsapp
      - WHATSAPP_HOOK_EVENTS=*
      - PORT=3000
      - WAHA_LOG_LEVEL=trace
      - WAHA_LOG_FORMAT=JSON
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=LoopsAdmin2026
      - WHATSAPP_API_KEY=${WAHA_API_KEY}

  # 3. FastAPI Bridge
  waha-bridge:
    build: .
    container_name: loops_waha_bridge
    restart: unless-stopped
    # Port 8000 remains internal for webhooks
    environment:
      - TRUSTED_NUMBERS=${TRUSTED_NUMBERS}
      - HERMES_API_URL=http://hermes_core:8642/v1/chat/completions
      - HERMES_API_KEY=${HERMES_API_KEY}
      - WAHA_API_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY}
      - DEBUG_MODE=true
    volumes:
      - hermes_data:/opt/data
    depends_on:
      - hermes-agent
      - waha

volumes:
  hermes_data:
    driver: local
