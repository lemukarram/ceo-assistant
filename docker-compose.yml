services:
  # 1. Hermes Assistant Core
  hermes-agent:
    image: nousresearch/hermes-agent:v2026.6.5
    container_name: hermes_core
    command: gateway run
    restart: unless-stopped
    ports:
      - "8642:8642" # Gateway API
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_INSECURE=true
      - HERMES_DASHBOARD_TUI=1
      - HERMES_SYSTEM_INSTRUCTIONS_PATH=/opt/data/SOUL.md
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHATSAPP_ENABLED=false
      - MCP_LINEAR_ENABLED=false
    volumes:
      - hermes_data:/opt/data
      - ./modern-ui.yaml:/root/.hermes/dashboard-themes/modern-ui.yaml:ro
      - ./rebrand.sh:/etc/cont-init.d/00-rebrand:ro
      - ./SOUL.md:/opt/data/SOUL.md:ro
      - ./tools:/opt/hermes/hermes_cli/tools:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Evolution API
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: loops_evolution_api
    restart: unless-stopped
    depends_on:
      - evolution-redis
      - evolution-postgres
    ports:
      - "8081:8080" # internal api port
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/6
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@evolution-postgres:5432/${POSTGRES_DATABASE}?schema=evolution_api
      - WEBHOOK_GLOBAL_URL=http://evolution-bridge:8000/webhook/whatsapp
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_EVENTS=MESSAGES_UPSERT
      - WEBHOOK_BASE64=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

  # 3. Evolution Manager (UI)
  evolution-manager:
    image: evoapicloud/evolution-manager:v2.3.5
    container_name: loops_evolution_manager
    restart: unless-stopped
    environment:
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}

  # 4. PostgreSQL for Evolution
  evolution-postgres:
    image: postgres:15
    container_name: loops_evolution_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Redis for Evolution
  evolution-redis:
    image: redis:latest
    container_name: loops_evolution_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. FastAPI Bridge
  evolution-bridge:
    build: .
    container_name: loops_evolution_bridge
    restart: unless-stopped
    ports:
      - "8000:8000" # Explicitly expose bridge port for Dokploy domain routing
    environment:
      - MASTER_CEO=${MASTER_CEO}
      - HERMES_API_URL=http://hermes_core:8642/v1/chat/completions
      - HERMES_API_KEY=${HERMES_API_KEY}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=loops
      - BASE_URL=${BASE_URL:-http://evolution-bridge:8000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEBUG_MODE=true
    volumes:
      - hermes_data:/opt/data
    depends_on:
      - hermes-agent
      - evolution-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 7. Auth Proxy (Caddy)
  caddy:
    image: caddy:2-alpine
    container_name: loops_auth_proxy
    restart: unless-stopped
    ports:
      - "9120:9120" # Secure Hermes Dashboard
      - "3005:3005" # Secure Evolution Dashboard
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - hermes-agent
      - evolution-manager

volumes:
  hermes_data:
    driver: local
  evolution_instances:
    driver: local
  evolution_store:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local