services:
  caddy:
    image: caddy:2-alpine
    container_name: loops_auth_proxy
    restart: unless-stopped
    ports:
      - "9119:9119" # Dashboard
      - "8000:8000" # WhatsApp Webhook
      - "3000:3000" # WAHA Dashboard
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - hermes-agent
      - waha-bridge

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes_core
    command: gateway run
    restart: unless-stopped
    ports:
      - "8642:8642"
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_INSECURE=true
      - HERMES_DASHBOARD_TUI=1
      - HERMES_SYSTEM_INSTRUCTIONS_PATH=/opt/data/SOUL.md
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - hermes_data:/opt/data
      - ./modern-ui.css:/opt/hermes/custom-style.css:ro
      - ./rebrand.sh:/etc/cont-init.d/00-rebrand:ro
      - ./SOUL.md:/opt/data/SOUL.md:ro

  # WhatsApp Gateway (WAHA)
  waha:
    image: devlikeapro/waha:latest
    container_name: loops_whatsapp_gw
    restart: unless-stopped
    environment:
      - WAHA_WH_URL=http://waha-bridge:8000/webhook/whatsapp
      - WAHA_WH_EVENTS=message.upsert
    # ports:
    #   - "3000:3000"

  # FastAPI Bridge
  waha-bridge:
    build: ./src/bridge
    container_name: loops_waha_bridge
    restart: unless-stopped
    environment:
      - TRUSTED_NUMBERS=${TRUSTED_NUMBERS}
      - HERMES_API_URL=http://hermes_core:8642/api/chat
      - HERMES_API_KEY=${HERMES_API_KEY}
      - WAHA_API_URL=http://waha:3000
    depends_on:
      - hermes-agent
      - waha

volumes:
  hermes_data:
    driver: local
